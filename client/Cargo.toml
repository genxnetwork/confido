[package]
name = "confido_client"
version = "0.0.1"
edition = "2021"

[dependencies]
confido = { path = "../lib" }
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tokio = { version = "1", features = ["full"] }
env_logger = "0.9"
rustls = "0.19"
webpki = "0.21.4"
reqwest = { version = "0.12.4", features = ["json", "native-tls", "blocking"] }
rustls-pemfile = "2.1.2"
native-tls = "0.2.12"
