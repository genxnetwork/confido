[package]
license = "Apache-2.0"
repository = "https://github.com/jandigitrust/confido"
name = "confido-cli"
version = "0.2.0"
edition = "2021"
[dependencies]
confido = { path = "../lib" }
serde_json = "1"
base64 = "0.13"
rand = "0.8"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
reqwest = { version = "0.11", default-features = false, features = ["json", "rustls-tls"] }
httpdate = "1"
