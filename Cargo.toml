[package]
name = "confido-suite"
version = "0.0.1"
edition = "2021"
license = ""
keywords = []
categories = ["cryptography", "virtualization"]
description = ""


[workspace]
members = [
    "lib",
    "client",
    "server",
]

[dependencies]
az-cvm-vtpm = "0.5.3"
bincode = "1.3.1"
jsonwebkey = { version = "0.3.5", features = ["pkcs-convert"] }
memoffset = "0.9.0"
openssl = { workspace = true, optional = true }
rsa = { version = "0.9.6", features = ["pkcs5", "sha2"] }
serde = "1.0.189"
serde_json = "1.0.107"
serde-big-array = "0.5.1"
sev = "3.1.1"
sha2 = "0.10.8"
thiserror = "1.0.38"
tss-esapi = "7.4"
zerocopy = "0.7.26"
az-snp-vtpm = "0.5.3"
clap = { version = "4", features = ["derive"] }
ureq = { version = "2.6.2", default-features = false, features = ["json"] }



[workspace.dependencies]
bincode = "1.3.1"
clap = { version = "4", features = ["derive"] }
openssl = "0.10"
serde = { version = "1.0.189", features = ["derive"] }
serde_json = "1.0.107"
thiserror = "1.0.38"
sev = "3.1.1"
ureq = { version = "2.6.2", default-features = false, features = ["json"] }
zerocopy = { version = "0.7.26", features = ["derive"] }