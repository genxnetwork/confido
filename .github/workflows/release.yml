name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build and Package
    runs-on: [self-hosted, fedora39]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Require a version tag
      run: |
        case "$GITHUB_REF" in
          refs/tags/v*) ;;
          *) echo "Run this release workflow on a v* tag" >&2; exit 1 ;;
        esac

    - name: Require matching binary versions
      run: |
        version="${GITHUB_REF#refs/tags/v}"
        for manifest in client/Cargo.toml; do
          package_version=$(sed -n 's/^version = "\(.*\)"$/\1/p' "$manifest" | head -n 1)
          if [ "$package_version" != "$version" ]; then
            echo "$manifest has version $package_version, expected $version" >&2
            exit 1
          fi
        done

    - name: Set up Rust
      uses: actions-rs/toolchain@v1
      with:
        toolchain: 1.98.0

    - name: Install Dependencies
      run: |
        sudo dnf install -y @development-tools openssl-devel pkgconfig rpm-build perl python3

        # Check if Perl and FindBin module are installed
        perl -e "use FindBin;" || { echo "Perl FindBin module not found!"; exit 1; }
        
        # Display Perl version for debugging
        perl -v

    - name: Build CLI Package
      run: |
        cd client
        cargo build --locked --release

    - name: Collect release licences and third-party attribution
      run: |
        set -euo pipefail
        mkdir -p rpmbuild/SOURCES
        cp LICENSE THIRD_PARTY_NOTICES.md rpmbuild/SOURCES/
        target=$(rustc -vV | sed -n 's/^host: //p')
        for component in client; do
          cargo metadata --locked --format-version 1 --filter-platform "$target" --manifest-path "$component/Cargo.toml" > "$RUNNER_TEMP/confido-$component-metadata.json"
          package_name="confido-cli"
          cp "$component/target/release/$package_name" "rpmbuild/SOURCES/$package_name"
          python3 scripts/collect_licenses.py "$RUNNER_TEMP/confido-$component-metadata.json" "rpmbuild/SOURCES/$package_name-third-party-licenses.tar.gz"
        done

    - name: Create RPM Package for CLI
      run: |
        VERSION=${GITHUB_REF#refs/tags/v}
        mkdir -p rpmbuild/{BUILD,RPMS,SOURCES,SPECS,SRPMS}
        
        # Use the correct path to the spec file in the repository
        cp ./client/specs/confido-cli.spec rpmbuild/SPECS/

        # Update version in the spec file
        sed -i "s/^Version:.*/Version: $VERSION/" rpmbuild/SPECS/confido-cli.spec

        # Build the RPM package
        rpmbuild --define "_topdir $(pwd)/rpmbuild" -bb rpmbuild/SPECS/confido-cli.spec
        mkdir -p package
        cp rpmbuild/RPMS/x86_64/confido-cli-$VERSION-1*.rpm package/confido-cli-$VERSION.rpm
        echo "VERSION=$VERSION" >> "$GITHUB_ENV"

    - name: Calculate CLI RPM hash
      run: |
        HASH=$(sha256sum package/confido-cli-${GITHUB_REF#refs/tags/v}.rpm | cut -d ' ' -f 1)
        echo "HASH=$HASH" >> "$GITHUB_ENV"

    - name: Create Release
      id: create_release
      uses: actions/create-release@v1
      with:
        tag_name: ${{ github.ref }}
        release_name: "Release ${{ github.ref }}"
        body: |
          **CLI Package Hash:** ${{ env.HASH }}
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Upload CLI Package
      uses: actions/upload-release-asset@v1
      with:
        upload_url: ${{ steps.create_release.outputs.upload_url }}
        asset_path: package/confido-cli-${{ env.VERSION }}.rpm
        asset_name: confido-cli-${{ env.VERSION }}.rpm
        asset_content_type: application/octet-stream
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
