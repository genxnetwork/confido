name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build and Package
    runs-on: [self-hosted, fedora39]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Clone azure-cvm-tooling
      run: |
        git clone https://github.com/genxnetwork/azure-cvm-tooling.git
        ln -sfn $GITHUB_WORKSPACE/azure-cvm-tooling $GITHUB_WORKSPACE/../

    - name: Set up Rust
      uses: actions-rs/toolchain@v1
      with:
        toolchain: stable

    - name: Install Dependencies
      run: |
        # Install necessary development tools and libraries
        sudo dnf install -y @development-tools openssl-devel pkgconfig tss2-devel tpm2-tss-devel rpm-build perl

        # Check if Perl and FindBin module are installed
        perl -e "use FindBin;" || { echo "Perl FindBin module not found!"; # exit 1; }

        # (Optional) Display Perl version for debugging
        perl -v

        # Check if tss2-sys library is available via pkg-config
        if ! pkg-config --exists tss2-sys; then
          echo "tss2-sys.pc not found! Ensure that tpm2-tss-devel package is installed."
          # exit 1
        fi

        # (Optional) Display pkg-config flags for tss2-sys
        pkg-config --cflags --libs tss2-sys

    - name: Build Server Package
      run: |
        cd server
        cargo build --release
        cp target/release/confido_server ./confido-server

    - name: Build Client Package
      run: |
        cd client
        cargo build --release
        cp target/release/confido_client ./confido-client

    - name: Create RPM Package for Server
      run: |
        VERSION=${GITHUB_REF#refs/tags/v}
        mkdir -p rpmbuild/{BUILD,RPMS,SOURCES,SPECS,SRPMS}
        
        # Create the spec file using a block scalar to handle % symbols correctly
        cat > rpmbuild/SPECS/confido-server.spec <<'EOF'
Name: confido-server
Version: $VERSION
Release: 1%{?dist}
Summary: Confido Server

License: Proprietary
URL: https://github.com/genxnetwork/confido

%description
Confido Server

%prep

%build

%install
mkdir -p %{buildroot}/usr/local/bin
install -m 0755 ./confido-server %{buildroot}/usr/local/bin/confido-server
mkdir -p %{buildroot}/etc/systemd/system
install -m 0644 ./deployment/systemd-confido.service %{buildroot}/etc/systemd/system/confido.service

%post
if [ \$1 -eq 1 ] ; then
  systemctl enable confido.service
  systemctl daemon-reload
  systemctl restart confido.service
fi

%files
/usr/local/bin/confido-server
/etc/systemd/system/confido.service

%changelog
* $(date "+%a %b %d %Y") Grigorii Bezborodov <g.bezborodov@genxnetwork.io> - $VERSION-1
- Initial RPM release
EOF

        # (Optional) Validate the spec file
        # rpmbuild -T -bb rpmbuild/SPECS/confido-server.spec || { echo "Spec file validation failed!"; # exit 1; }

        # Build the RPM package
        rpmbuild --define "_topdir $(pwd)/rpmbuild" -bb rpmbuild/SPECS/confido-server.spec
        mkdir -p package
        cp rpmbuild/RPMS/x86_64/confido-server-$VERSION-1*.rpm package/confido-server-$VERSION.rpm
        echo "VERSION=$VERSION" >> $GITHUB_ENV

    - name: Create RPM Package for Client
      run: |
        VERSION=${GITHUB_REF#refs/tags/v}
        mkdir -p rpmbuild/{BUILD,RPMS,SOURCES,SPECS,SRPMS}
        
        # Create the spec file using a block scalar to handle % symbols correctly
        cat > rpmbuild/SPECS/confido-client.spec <<'EOF'
Name: confido-client
Version: $VERSION
Release: 1%{?dist}
Summary: Confido Client

License: Proprietary
URL: https://github.com/genxnetwork/confido

%description
Confido Client

%prep

%build

%install
mkdir -p %{buildroot}/usr/local/bin
install -m 0755 ./confido-client %{buildroot}/usr/local/bin/confido-client

%files
/usr/local/bin/confido-client

%changelog
* $(date "+%a %b %d %Y") Grigorii Bezborodov <g.bezborodov@genxnetwork.io> - $VERSION-1
- Initial RPM release
EOF

        # (Optional) Validate the spec file
        # rpmbuild -T -bb rpmbuild/SPECS/confido-client.spec || { echo "Spec file validation failed!"; # exit 1; }

        # Build the RPM package
        rpmbuild --define "_topdir $(pwd)/rpmbuild" -bb rpmbuild/SPECS/confido-client.spec
        cp rpmbuild/RPMS/x86_64/confido-client-$VERSION-1*.rpm package/confido-client-$VERSION.rpm

    - name: Calculate Hash of Server RPM
      id: calculate_hash
      run: |
        HASH=$(sha256sum package/confido-server-${GITHUB_REF#refs/tags/v}.rpm | cut -d ' ' -f 1)
        echo "HASH=$HASH" >> $GITHUB_ENV

    - name: Create Release
      id: create_release
      uses: actions/create-release@v1
      with:
        tag_name: ${{ github.ref }}
        release_name: "Release ${{ github.ref }}"
        body: |
          **Server Package Hash:** ${{ env.HASH }}
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Upload Server Package
      uses: actions/upload-release-asset@v1
      with:
        upload_url: ${{ steps.create_release.outputs.upload_url }}
        asset_path: package/confido-server-${{ env.VERSION }}.rpm
        asset_name: confido-server-${{ env.VERSION }}.rpm
        asset_content_type: application/octet-stream
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Upload Client Package
      uses: actions/upload-release-asset@v1
      with:
        upload_url: ${{ steps.create_release.outputs.upload_url }}
        asset_path: package/confido-client-${{ env.VERSION }}.rpm
        asset_name: confido-client-${{ env.VERSION }}.rpm
        asset_content_type: application/octet-stream
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
