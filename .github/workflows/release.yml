name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build and Package
    runs-on: [self-hosted, fedora39]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Require a version tag
      run: |
        case "$GITHUB_REF" in
          refs/tags/v*) ;;
          *) echo "Run this release workflow on a v* tag" >&2; exit 1 ;;
        esac

    - name: Require matching binary versions
      run: |
        version="${GITHUB_REF#refs/tags/v}"
        for manifest in server/Cargo.toml client/Cargo.toml; do
          package_version=$(sed -n 's/^version = "\(.*\)"$/\1/p' "$manifest" | head -n 1)
          if [ "$package_version" != "$version" ]; then
            echo "$manifest has version $package_version, expected $version" >&2
            exit 1
          fi
        done

    - name: Set up Rust
      uses: actions-rs/toolchain@v1
      with:
        toolchain: stable

    - name: Install Dependencies
      run: |
        sudo dnf install -y @development-tools openssl-devel pkgconfig tss2-devel tpm2-tss-devel rpm-build perl python3

        # Check if Perl and FindBin module are installed
        perl -e "use FindBin;" || { echo "Perl FindBin module not found!"; exit 1; }
        
        # Display Perl version for debugging
        perl -v

        # Check if tss2-sys library is available via pkg-config
        if ! pkg-config --exists tss2-sys; then
          echo "tss2-sys.pc not found! Ensure that tpm2-tss-devel package is installed."
          exit 1
        fi

        # Display pkg-config flags for tss2-sys
        pkg-config --cflags --libs tss2-sys

    - name: Build Server Package
      run: |
        cd server
        cargo build --locked --release
        cp target/release/confido-server ./confido-server

    - name: Build Client Package
      run: |
        cd client
        cargo build --locked --release
        cp target/release/confido_client ./confido-client

    - name: Collect release licences and third-party attribution
      run: |
        set -euo pipefail
        mkdir -p rpmbuild/SOURCES
        cp LICENSE THIRD_PARTY_NOTICES.md rpmbuild/SOURCES/
        for component in server client; do
          cargo metadata --locked --format-version 1 --manifest-path "$component/Cargo.toml" > "$RUNNER_TEMP/confido-$component-metadata.json"
          python3 scripts/collect_licenses.py "$RUNNER_TEMP/confido-$component-metadata.json" "rpmbuild/SOURCES/confido-$component-third-party-licenses.tar.gz"
        done

    - name: Create RPM Package for Server
      run: |
        VERSION=${GITHUB_REF#refs/tags/v}
        mkdir -p rpmbuild/{BUILD,RPMS,SOURCES,SPECS,SRPMS}
        
        # Use the correct path to the spec file in the repository
        cp ./server/specs/confido-server.spec rpmbuild/SPECS/

        # Update version in the spec file
        sed -i "s/^Version:.*/Version: $VERSION/" rpmbuild/SPECS/confido-server.spec

        # Build the RPM package
        rpmbuild --define "_topdir $(pwd)/rpmbuild" -bb rpmbuild/SPECS/confido-server.spec
        mkdir -p package
        cp rpmbuild/RPMS/x86_64/confido-server-$VERSION-1*.rpm package/confido-server-$VERSION.rpm
        echo "VERSION=$VERSION" >> $GITHUB_ENV

    - name: Create RPM Package for Client
      run: |
        VERSION=${GITHUB_REF#refs/tags/v}
        mkdir -p rpmbuild/{BUILD,RPMS,SOURCES,SPECS,SRPMS}
        
        # Use the correct path to the spec file in the repository
        cp ./client/specs/confido-client.spec rpmbuild/SPECS/

        # Update version in the spec file
        sed -i "s/^Version:.*/Version: $VERSION/" rpmbuild/SPECS/confido-client.spec

        # Build the RPM package
        rpmbuild --define "_topdir $(pwd)/rpmbuild" -bb rpmbuild/SPECS/confido-client.spec
        cp rpmbuild/RPMS/x86_64/confido-client-$VERSION-1*.rpm package/confido-client-$VERSION.rpm

    - name: Calculate Hash of Server RPM
      id: calculate_hash
      run: |
        HASH=$(sha256sum package/confido-server-${GITHUB_REF#refs/tags/v}.rpm | cut -d ' ' -f 1)
        echo "HASH=$HASH" >> $GITHUB_ENV

    - name: Create Release
      id: create_release
      uses: actions/create-release@v1
      with:
        tag_name: ${{ github.ref }}
        release_name: "Release ${{ github.ref }}"
        body: |
          **Server Package Hash:** ${{ env.HASH }}
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Upload Server Package
      uses: actions/upload-release-asset@v1
      with:
        upload_url: ${{ steps.create_release.outputs.upload_url }}
        asset_path: package/confido-server-${{ env.VERSION }}.rpm
        asset_name: confido-server-${{ env.VERSION }}.rpm
        asset_content_type: application/octet-stream
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Upload Client Package
      uses: actions/upload-release-asset@v1
      with:
        upload_url: ${{ steps.create_release.outputs.upload_url }}
        asset_path: package/confido-client-${{ env.VERSION }}.rpm
        asset_name: confido-client-${{ env.VERSION }}.rpm
        asset_content_type: application/octet-stream
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
