name: Publish Python wheel to PyPI

on:
  push:
    tags:
      - 'pypi-v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    if: github.event_name == 'push'
    name: Build and test wheel
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          path: confido
          fetch-depth: 0
      - name: Require a master commit
        working-directory: confido
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/master; then
            echo "Release tag must point to a commit on master" >&2
            exit 1
          fi
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config perl libssl-dev clang libclang-dev libtss2-dev python3-dev python3-venv
          rustup toolchain install stable --profile minimal
          rustup default stable
      - name: Build and test the wheel
        working-directory: confido
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 -m venv .venv
          . .venv/bin/activate
          python -m pip install 'maturin>=1.6,<2' patchelf tomli
          python - <<'PY'
          import os
          from pathlib import Path
          import tomli

          with Path('lib/pyproject.toml').open('rb') as source:
              package = tomli.load(source)['project']
          with Path('lib/Cargo.toml').open('rb') as source:
              crate = tomli.load(source)['package']
          version = package['version']
          if package['name'] != 'confido-atls':
              raise SystemExit('Unexpected PyPI distribution name')
          if crate['version'] != version or os.environ['RELEASE_TAG'] != f'pypi-v{version}':
              raise SystemExit('Release tag, Python version, and crate version must match')
          PY
          make -C lib wheel PYTHON=python
          python -m pip install --no-index --no-deps lib/target/wheels/confido*.whl
          python -m unittest discover -s lib/tests -p 'test_*.py' -v
      - uses: actions/upload-artifact@v4
        with:
          name: python-wheel
          path: confido/lib/target/wheels/*.whl
          if-no-files-found: error

  publish:
    if: github.event_name == 'push'
    name: Publish wheel
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - name: Require PyPI token secret
        env:
          PYPI_API_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          if [ -z "$PYPI_API_TOKEN" ]; then
            echo "Set PYPI_API_TOKEN as a GitHub Actions secret" >&2
            exit 1
          fi
      - uses: actions/download-artifact@v4
        with:
          name: python-wheel
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          user: __token__
          password: ${{ secrets.PYPI_API_TOKEN }}
          attestations: false

  check-token:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master'
    name: Check PyPI API token
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - name: Verify PyPI accepts the GitHub secret
        env:
          PYPI_API_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          python3 - <<'PYCODE'
          import base64
          import os
          import re
          from urllib.error import HTTPError
          from urllib.parse import urlencode
          from urllib.request import Request, urlopen

          token = os.environ.get('PYPI_API_TOKEN', '').strip()
          if not re.fullmatch(r'pypi-[A-Za-z0-9_-]{85,}', token):
              raise SystemExit('PYPI_API_TOKEN secret is missing or malformed')

          # No content field or package file is sent, so no release can be created.
          fields = {
              ':action': 'file_upload',
              'protocol_version': '1',
              'metadata_version': '2.1',
              'name': 'confido-atls',
              'version': '0.1.6',
              'summary': 'Credential connectivity check',
              'filetype': 'bdist_wheel',
              'pyversion': 'cp310',
              'sha256_digest': '0' * 64,
          }
          credentials = base64.b64encode(f'__token__:{token}'.encode()).decode('ascii')
          request = Request(
              'https://upload.pypi.org/legacy/',
              data=urlencode(fields).encode('ascii'),
              headers={'Authorization': f'Basic {credentials}'},
              method='POST',
          )
          try:
              with urlopen(request, timeout=15) as response:
                  status = response.status
                  body = response.read(2048).decode('utf-8', errors='replace')
          except HTTPError as error:
              status = error.code
              body = error.read(2048).decode('utf-8', errors='replace')

          if status == 400 and 'Upload payload does not have a file' in body:
              print('PyPI accepted the GitHub token; no package was uploaded.')
          else:
              raise SystemExit(f'PyPI token check failed (HTTP {status})')
          PYCODE
