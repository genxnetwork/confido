name: Test

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          path: confido
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config perl libssl-dev clang libclang-dev libtss2-dev python3-dev python3-venv
          rustup toolchain install stable --profile minimal
          rustup default stable
      - name: Rust tests and binaries
        working-directory: confido
        run: |
          cargo test --manifest-path lib/Cargo.toml
          cargo test --manifest-path server/Cargo.toml
          cargo build --manifest-path server/Cargo.toml
          cargo build --manifest-path client/Cargo.toml
      - name: Build and test installed wheel
        working-directory: confido
        run: |
          python3 -m venv .venv
          . .venv/bin/activate
          python -m pip install 'maturin>=1.6,<2' patchelf
          make -C lib install PYTHON=python
          python -m unittest discover -s lib/tests -p 'test_*.py' -v
