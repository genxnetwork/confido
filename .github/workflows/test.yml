name: Test
on:
  pull_request:
  push:
    branches: [master]
permissions:
  contents: read
jobs:
  protocol:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install 1.98.0 --profile minimal
      - run: cargo test --manifest-path protocol/Cargo.toml
