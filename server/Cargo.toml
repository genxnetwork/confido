[package]
name = "confido_server"
version = "0.0.1"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
confido = { path = "../lib" }
openssl.workspace = true
serde = "1.0"
serde_json = "1.0"
log = "0.4"

base64 = "0.13.0"
env_logger = "0.9"
tokio = { version = "1", features = ["full"] }
tokio-rustls = "0.22"
rustls = "0.19"
hyper = { version = "0.14", features = ["full"] }
hyper-rustls = "0.22"
warp = "0.3"
webpki = "0.21.4"
rcgen = "0.8.10"
hyper-openssl = "0.8"

actix-web = "4.0.0-beta.8" 
clap = "3.0.0-beta.5"
