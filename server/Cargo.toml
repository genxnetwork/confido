[package]
license = "Apache-2.0"
repository = "https://github.com/jandigitrust/confido"
name = "confido_server"
version = "0.2.0"
edition = "2021"

[[bin]]
name = "confido-server"
path = "src/main.rs"

[dependencies]
confido = { path = "../lib" }
az-snp-vtpm = { git = "https://github.com/kinvolk/azure-cvm-tooling", rev = "9c6bff6c959994da280f8b3b5bad62a1600063d0", features = ["attester"] }
openssl = { version = "0.10", features = ["vendored"] }
serde = "1.0"
serde_json = "1.0"
log = "0.4"
base64 = "0.13.0"
env_logger = "0.9"
tokio = { version = "1", features = ["full"] }
actix-web = "4.0.0-beta.8" 
clap = "3.0.0-beta.5"

confido-protocol = { path = "../protocol" }
tss-esapi = "7.7"
x509-parser = "=0.16.0"
