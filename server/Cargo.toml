[package]
name = "confido_server"
version = "0.0.1"
edition = "2021"
license = "Apache-2.0"

[[bin]]
name = "confido_server"
path = "src/main.rs"

[dependencies]
confido = { path = "../lib" }
az-snp-vtpm = { path = "../../azure-cvm-tooling/az-cvm-vtpm/az-snp-vtpm", features = ["attester"] }
openssl = "0.10"
serde = "1.0"
serde_json = "1.0"
log = "0.4"
base64 = "0.13.0"
env_logger = "0.9"
tokio = { version = "1", features = ["full"] }
tokio-rustls = "0.22"
rustls = "0.19"
hyper = { version = "0.14", features = ["full"] }
hyper-rustls = "0.22"
warp = "0.3"
webpki = "0.21.4"
rcgen = "0.8.10"
hyper-openssl = "0.8"
regex = "1.5"
actix-web = "4.0.0-beta.8" 
clap = "3.0.0-beta.5"
bollard = { version = "0.16" }
futures-util = "0.3"
libc = "0.2"
