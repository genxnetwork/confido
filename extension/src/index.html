<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Confido evidence verifier</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <h1>Confido evidence verifier</h1>
    <p>
      Evidence is verified locally against your selected policy. The result does
      not authenticate a browser connection or authorize future requests.
    </p>

    <label>Verifier policy <input id="policy" type="file" accept=".json"></label>
    <label>Evidence service <select id="origin"></select></label>
    <button id="live">Retrieve and verify evidence</button>

    <hr>
    <label>Historical archive <input id="archive" type="file" accept=".json"></label>
    <label>
      Evaluation time (Unix seconds)
      <input id="time" type="number" min="0" step="1">
    </label>
    <button id="replay">Replay archive</button>

    <p id="status" role="status">Choose a locally trusted policy.</p>
    <pre id="result"></pre>
    <button id="save" disabled>Save verification archive</button>
  </main>
  <script type="module" src="ui.js"></script>
</body>
</html>
