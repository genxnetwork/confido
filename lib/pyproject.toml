[build-system]
requires = ["maturin>=1.6,<2"]
build-backend = "maturin"

[project]
name = "confido-atls"
version = "0.2.0"
description = "Attested TLS with TPM quote and IMA measurement verification"
readme = "README.md"

[project.urls]
Repository = "https://github.com/genxnetwork/confido"

[tool.maturin]
bindings = "pyo3"
module-name = "confido"
