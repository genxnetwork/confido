[build-system]
requires = ["maturin==1.15.0"]
build-backend = "maturin"

[project]
name = "confido-atls"
version = "0.3.0"
description = "Attested TLS with TPM quote and IMA measurement verification"
readme = "README.md"
license = { text = "Apache-2.0" }

[project.urls]
Repository = "https://github.com/genxnetwork/confido"

[tool.maturin]
bindings = "pyo3"
features = ["python"]
module-name = "confido"
