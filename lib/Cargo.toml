[package]
license = "Apache-2.0"
name = "confido"
version = "0.4.0"
edition = "2021"
description = "Deterministic local evidence verification"
[dependencies]
confido-protocol = { path = "../protocol" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.13"
hex = "0.4"
ring = { version = "0.17.14", default-features = false, features = ["alloc"] }
x509-parser = { version = "=0.16.0", features = ["verify"] }
[dev-dependencies]
openssl = { version = "0.10", features = ["vendored"] }
